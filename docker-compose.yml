services:
  boardupdispatch:
    build:
      context: .
      dockerfile: Dockerfile
    image: boardupdispatch:latest
    container_name: boardupdispatch
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: https://boardupdispatch.com
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"
